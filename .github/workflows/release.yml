name: Release packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  linux:
    name: Package Linux x86_64 (archive + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Check release shell scripts
        run: |
          bash -n scripts/release/*.sh
          sh -n scripts/install.sh
          shellcheck scripts/release/*.sh scripts/install.sh
          bash scripts/release/test-checks.sh
      - name: Check version and build Linux binary
        run: bash scripts/release/build-linux.sh
      - name: Package and smoke-test Linux installs
        run: bash scripts/release/package-linux.sh
      - name: Upload tested Linux release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Package Windows x86_64 (zip + PATH installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Build and check Windows binary
        shell: pwsh
        run: .\scripts\release\build-windows.ps1
      - name: Package and smoke-test Windows installer
        shell: pwsh
        run: .\scripts\release\package-windows.ps1
      - name: Upload tested Windows release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified GitHub release (tag only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: release-*
          path: dist
          merge-multiple: false
      - name: Verify release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/publish.sh
