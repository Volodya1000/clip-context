name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install file and YAML checks
        run: python3 -m pip install pre-commit==4.3.0 yamllint==1.37.1
      - name: File hygiene, YAML and TOML syntax, private keys
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Strict YAML validation
        run: yamllint --strict .github .pre-commit-config.yaml .yamllint
      - name: Validate contribution-policy tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint GitHub Actions and embedded shell
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  toml:
    name: TOML syntax and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Install Taplo
        run: cargo install taplo-cli --locked --version 0.9.3
      - name: Check TOML syntax
        run: taplo lint --no-schema
      - name: Check TOML formatting
        run: taplo fmt --check --diff

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy (all targets and features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run all tests
        run: cargo test --locked --all-targets --all-features
      - name: Run doctests
        run: cargo test --locked --doc
      - name: Deny rustdoc warnings
        run: cargo doc --locked --no-deps --document-private-items
      - name: Check optimized build
        run: cargo build --release --locked

  msrv:
    name: Minimum Rust version 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: 1.85.0
      - name: Test supported minimum compiler
        run: cargo +1.85.0 test --locked --all-targets --all-features

  dependency-security:
    name: Dependency security and licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          tool: cargo-audit
      - name: Audit RustSec advisories
        run: cargo audit --deny warnings

  coverage:
    name: Test coverage (75% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce line coverage
        run: cargo llvm-cov --locked --workspace --all-features --fail-under-lines 75

  conventional-commits:
    name: Conventional Commits (Cocogitto)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate Git commit history
        uses: cocogitto/cocogitto-action@390bda87a19bf627e03ad075c67a11e9ddbb7547  # v4
        with:
          command: check
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"

  changelog:
    name: CHANGELOG.md is updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require changelog changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md)"
          if [ "$changed" != "CHANGELOG.md" ]; then
            echo "::error::Every pull request must update CHANGELOG.md."
            exit 1
          fi

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          advanced-security: false
