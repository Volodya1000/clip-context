[package]
name = "clip-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first CLI for packaging project code for sharing"
license = "MIT"
repository = "https://github.com/Volodya1000/clip-context"
readme = "README.md"
keywords = ["cli", "clipboard", "developer-tools", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ignore = "=0.4.29"
serde = { version = "1.0", features = ["derive"] }
toml = "=0.8.23"
tar = "=0.4.45"
tempfile = "=3.27.0"

[[bin]]
name = "cpctx"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_lifetimes = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
